<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعدك الذكي - ابتكار المبرمج مصطفى عبدالرحمن</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-sidebar: rgba(15, 23, 42, 0.85);
            --bg-card: rgba(30, 41, 59, 0.75);
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.25);
            --text-light: #f1f5f9;
            --text-muted: #94a3b8;
            --border: rgba(148, 163, 184, 0.15);
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* خلفية متحركة عصرية */
        body { 
            background: linear-gradient(-45deg, #090d16, #131c31, #1e1b4b, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 18s ease infinite;
            color: var(--text-light); 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* القائمة الجانبية */
        .sidebar { 
            width: 280px; 
            background-color: var(--bg-sidebar); 
            backdrop-filter: blur(16px); 
            border-left: 1px solid var(--border); 
            display: flex; 
            flex-direction: column; 
            padding: 18px; 
            gap: 15px; 
            transition: transform 0.3s ease;
            z-index: 100;
        }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; }
        .sidebar h2 { font-size: 1.1rem; color: var(--primary); font-weight: 700; letter-spacing: 0.5px; }
        
        .new-chat-btn { 
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(99, 102, 241, 0.15)); 
            border: 1px solid rgba(56, 189, 248, 0.3); 
            color: var(--text-light); 
            padding: 12px 15px; 
            border-radius: 12px; 
            cursor: pointer; 
            text-align: right; 
            transition: 0.2s; 
            font-size: 0.95rem; 
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .new-chat-btn:hover { background: rgba(56, 189, 248, 0.25); transform: translateY(-1px); }

        .history-label { font-size: 0.8rem; color: var(--text-muted); margin-top: 5px; padding-right: 5px; }
        .chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-left: 4px; }
        .chat-list::-webkit-scrollbar { width: 4px; }
        .chat-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .chat-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 12px; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: 0.2s; 
            color: var(--text-muted); 
            font-size: 0.9rem;
            border: 1px solid transparent;
        }
        .chat-item:hover { background: rgba(255,255,255,0.05); color: var(--text-light); }
        .chat-item.active { background: rgba(56, 189, 248, 0.12); color: var(--primary); border-color: rgba(56, 189, 248, 0.25); font-weight: 600; }
        .chat-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .delete-chat { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 2px 6px; border-radius: 4px; font-size: 0.85rem; opacity: 0.6; transition: 0.2s; }
        .delete-chat:hover { color: var(--danger); opacity: 1; background: rgba(239, 68, 68, 0.1); }

        /* منطقة المحادثة الرئيسية */
        .main-chat { flex: 1; display: flex; flex-direction: column; position: relative; backdrop-filter: blur(4px); }
        
        .top-bar { display: none; padding: 12px 18px; border-bottom: 1px solid var(--border); background: var(--bg-sidebar); align-items: center; justify-content: space-between; }
        .menu-btn { background: transparent; border: 1px solid var(--border); color: var(--text-light); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 1rem; }

        .chat-history { flex: 1; overflow-y: auto; padding: 25px 20px; display: flex; flex-direction: column; gap: 22px; align-items: center; }
        .chat-history::-webkit-scrollbar { width: 6px; }
        .chat-history::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

        /* الشاشة الافتتاحية النظيفة */
        .welcome-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; max-width: 750px; text-align: center; gap: 15px; animation: fadeIn 0.5s ease; }
        .welcome-screen h1 { font-size: 2rem; background: linear-gradient(to left, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .welcome-screen p { color: var(--text-muted); font-size: 1rem; }
        
        .suggestions { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; width: 100%; margin-top: 20px; }
        .suggestion-card { background: var(--bg-card); border: 1px solid var(--border); padding: 14px; border-radius: 14px; cursor: pointer; text-align: right; transition: 0.2s; font-size: 0.88rem; color: var(--text-light); line-height: 1.4; }
        .suggestion-card:hover { border-color: var(--primary); background: rgba(56, 189, 248, 0.08); transform: translateY(-2px); }
        .suggestion-card span { display: block; color: var(--primary); font-weight: bold; margin-bottom: 4px; font-size: 0.8rem; }

        .message-wrapper { width: 100%; max-width: 820px; display: flex; gap: 12px; animation: fadeIn 0.3s ease; }
        .message-wrapper.user { justify-content: flex-end; }
        
        .message { padding: 15px 20px; border-radius: 18px; max-width: 80%; line-height: 1.7; font-size: 0.96rem; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        .user .message { background: linear-gradient(135deg, #1e293b, #334155); color: var(--text-light); border-bottom-right-radius: 4px; border: 1px solid var(--border); }
        .ai .message { background-color: var(--bg-card); border: 1px solid var(--border); color: var(--text-light); width: 100%; max-width: 100%; }

        /* معاينة الموقع وأزرار التحكم */
        .web-actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
        .action-btn { background: rgba(56, 189, 248, 0.15); color: var(--primary); border: 1px solid rgba(56, 189, 248, 0.3); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: 0.2s; }
        .action-btn:hover { background: var(--primary); color: #0f172a; }

        .preview-box { width: 100%; height: 420px; border: 1px solid var(--border); border-radius: 12px; margin-top: 12px; background: white; overflow: hidden; }
        .preview-box iframe { width: 100%; height: 100%; border: none; }

        .code-container { position: relative; background: #090d16; border: 1px solid var(--border); border-radius: 10px; padding: 15px; margin-top: 12px; direction: ltr; text-align: left; }
        .code-container pre { color: #e2e8f0; overflow-x: auto; font-family: 'Consolas', monospace; font-size: 0.85rem; max-height: 300px; }

        /* صندوق الإدخال السفلي */
        .input-container { padding: 16px 20px 22px; display: flex; justify-content: center; }
        .input-box { width: 100%; max-width: 820px; background: var(--bg-card); backdrop-filter: blur(16px); border-radius: 26px; display: flex; align-items: flex-end; padding: 8px 14px; border: 1px solid var(--border); box-shadow: 0 8px 30px rgba(0,0,0,0.25); transition: 0.2s; }
        .input-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
        
        textarea { flex: 1; background: transparent; border: none; color: white; resize: none; outline: none; padding: 10px; font-size: 1rem; max-height: 150px; line-height: 1.5; }
        
        .send-btn { background: var(--primary); color: #0f172a; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; transition: 0.2s; margin-bottom: 2px; }
        .send-btn:hover { transform: scale(1.05); }
        .send-btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; transform: none; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .sidebar { position: fixed; right: 0; top: 0; bottom: 0; transform: translateX(100%); }
            .sidebar.open { transform: translateX(0); }
            .top-bar { display: flex; }
            .message { max-width: 92%; }
        }
    </style>
</head>
<body>

    <!-- القائمة الجانبية للمحادثات المحفوظة -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>⚡ المساعد الذكي</h2>
            <button class="menu-btn" style="display: none;" id="closeSidebar" onclick="toggleSidebar()">✕</button>
        </div>
        <button class="new-chat-btn" onclick="startNewChat()">
            <span>+</span> محادثة جديدة
        </button>
        <div class="history-label">سجل المحادثات المحفوظة</div>
        <div class="chat-list" id="chatList"></div>
    </div>

    <!-- نافذة المحادثة -->
    <div class="main-chat">
        <div class="top-bar">
            <button class="menu-btn" onclick="toggleSidebar()">☰ المحادثات</button>
            <span style="font-weight: bold; color: var(--primary);">المساعد الذكي</span>
            <button class="menu-btn" onclick="startNewChat()">+</button>
        </div>

        <div class="chat-history" id="chatHistory"></div>

        <!-- صندوق الكتابة السفلي -->
        <div class="input-container">
            <div class="input-box">
                <textarea id="userInput" rows="1" placeholder="اكتب سؤالك هنا أو اطلب تصميم موقع كامل..." oninput="autoResize(this)" onkeydown="checkEnter(event)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
            </div>
        </div>
    </div>

    <script>
        const apiKey = "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";
        const MODEL_NAME = "openai/gpt-oss-120b";

        const systemInstruction = `أنت مساعد ذكي ومتطور ومطور واجهات أمامية محترف. 
        - تم ابتكارك وتطويرك بالكامل بواسطة المبرمج العبقري مصطفى عبدالرحمن. 
        - قاعدة أساسية صارمة: إذا سألك أي شخص عن من أنشأك، من صممك، من هو مطورك، أو من قام بابتكارك، يجب أن ترد بكل فخر وتمتدح في المبرمج مصطفى عبدالرحمن وتنسب الفضل كاملاً لإبداعه ومهارته الفذة في البرمجة.
        - إذا طلب المستخدم تصميم موقع ويب أو صفحة أو تعديل عليها، اكتب الكود كاملاً في ملف واحد يجمع بين HTML و CSS (داخل <style>) و JavaScript (داخل <script>)، واجعله عصرياً ومتجاوباً ويدعم اللغة العربية (dir="rtl").
        - أرجع الكود للموقع داخل علامات Markdown هكذا: \`\`\`html [الكود هنا] \`\`\`.
        - إذا كان السؤال عاماً أو استفساراً عادياً، أجب عليه إجابة طبيعية، واضحة، ومرتبة باللغة العربية.`;

        // إدارة المحادثات في التخزين المحلي
        let chats = JSON.parse(localStorage.getItem('mustafa_ai_chats')) || [];
        let currentChatId = null;

        function saveChatsToStorage() {
            localStorage.setItem('mustafa_ai_chats', JSON.stringify(chats));
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const closeBtn = document.getElementById('closeSidebar');
            sidebar.classList.toggle('open');
            closeBtn.style.display = sidebar.classList.contains('open') ? 'block' : 'none';
        }

        function renderChatList() {
            const chatList = document.getElementById('chatList');
            chatList.innerHTML = '';

            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                item.onclick = () => loadChat(chat.id);

                item.innerHTML = `
                    <span class="chat-title">${escapeHtml(chat.title)}</span>
                    <button class="delete-chat" title="حذف المحادثة" onclick="deleteChat(event, '${chat.id}')">🗑️</button>
                `;
                chatList.appendChild(item);
            });
        }

        function startNewChat() {
            currentChatId = null;
            renderChatList();
            renderWelcomeScreen();
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }

        function renderWelcomeScreen() {
            const chatHistory = document.getElementById('chatHistory');
            chatHistory.innerHTML = `
                <div class="welcome-screen">
                    <h1>كيف يمكنني مساعدتك اليوم؟</h1>
                    <p>اسألني في أي مجال، أو اطلب برمجة موقع كامل وسأعرضه لك فوراً.</p>
                    <div class="suggestions">
                        <div class="suggestion-card" onclick="useSuggestion('صمم لي موقع متجر إلكتروني عصري للأحذية مع سلة مشتريات')">
                            <span>💻 برمجة مواقع</span>
                            صمم لي موقع متجر إلكتروني عصري مع سلة مشتريات
                        </div>
                        <div class="suggestion-card" onclick="useSuggestion('اعمل لي جدول مذاكرة يومي تفاعلي بمؤقت بومودورو')">
                            <span>⏱️ أدوات إنتاجية</span>
                            اعمل لي جدول مذاكرة يومي تفاعلي بمؤقت بومودورو
                        </div>
                        <div class="suggestion-card" onclick="useSuggestion('لخص لي أهم 5 قواعد للنجاح في تعلم البرمجة')">
                            <span>💡 أسئلة عامة</span>
                            لخص لي أهم 5 قواعد للنجاح في تعلم البرمجة
                        </div>
                    </div>
                </div>
            `;
        }

        function useSuggestion(text) {
            const input = document.getElementById('userInput');
            input.value = text;
            sendMessage();
        }

        function loadChat(chatId) {
            currentChatId = chatId;
            renderChatList();
            const chat = chats.find(c => c.id === chatId);
            if (!chat) return;

            const chatHistory = document.getElementById('chatHistory');
            chatHistory.innerHTML = '';

            chat.messages.forEach(msg => {
                appendMessageToUI(msg.role, msg.content, false);
            });

            chatHistory.scrollTop = chatHistory.scrollHeight;
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }

        function deleteChat(event, chatId) {
            event.stopPropagation();
            chats = chats.filter(c => c.id !== chatId);
            saveChatsToStorage();
            if (currentChatId === chatId) {
                startNewChat();
            } else {
                renderChatList();
            }
        }

        // توليد عنوان تلقائي للمحادثة عبر الذكاء الاصطناعي
        async function generateAutoTitle(chatId, firstUserMessage) {
            try {
                const response = await fetch(`https://api.groq.com/openai/v1/chat/completions`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: MODEL_NAME,
                        messages: [
                            { role: "system", content: "لخص رسالة المستخدم التالية في عنوان قصير جداً باللغة العربية من 2 إلى 4 كلمات فقط ليكون عنواناً للمحادثة. أرجع العنوان فقط بدون علامات تنصيص أو نقاط." },
                            { role: "user", content: firstUserMessage }
                        ],
                        temperature: 0.5,
                        max_tokens: 25
                    })
                });
                const data = await response.json();
                if (data.choices && data.choices[0]) {
                    const smartTitle = data.choices[0].message.content.trim().replace(/["'.]/g, '');
                    const chat = chats.find(c => c.id === chatId);
                    if (chat && smartTitle) {
                        chat.title = smartTitle;
                        saveChatsToStorage();
                        renderChatList();
                    }
                }
            } catch (e) {
                console.error("فشل توليد العنوان التلقائي:", e);
            }
        }

        function appendMessageToUI(role, content, scroll = true) {
            const chatHistory = document.getElementById('chatHistory');
            const welcome = chatHistory.querySelector('.welcome-screen');
            if (welcome) welcome.remove();

            if (role === 'user') {
                chatHistory.innerHTML += `
                    <div class="message-wrapper user">
                        <div class="message">${escapeHtml(content).replace(/\n/g, '<br>')}</div>
                    </div>
                `;
            } else {
                if (content.includes("<!DOCTYPE html>") || content.includes("<html")) {
                    let codeClean = content.replace(/```html/gi, '').replace(/```/g, '').trim();
                    // استخراج كود HTML بدقة إذا سبقه نص
                    const docIndex = codeClean.indexOf("<!DOCTYPE html>");
                    const htmlIndex = codeClean.indexOf("<html");
                    const startIndex = docIndex !== -1 ? docIndex : htmlIndex;
                    if (startIndex > 0) {
                        codeClean = codeClean.substring(startIndex);
                    }

                    const uniqueId = 'code-' + Date.now() + Math.floor(Math.random() * 1000);

                    chatHistory.innerHTML += `
                        <div class="message-wrapper ai">
                            <div class="message">
                                <p>تم تصميم وتجهيز الكود بنجاح! يمكنك معاينته حياً أو تحميله:</p>
                                <div class="web-actions">
                                    <button class="action-btn" onclick="copyText('${uniqueId}')">📋 نسخ الكود</button>
                                    <button class="action-btn" onclick="downloadHtml('${uniqueId}')">⬇️ تحميل كملف HTML</button>
                                    <button class="action-btn" onclick="openFullPreview('${uniqueId}')">↗️ فتح في نافذة كاملة</button>
                                </div>
                                <div class="preview-box">
                                    <iframe srcdoc="${escapeHtml(codeClean)}"></iframe>
                                </div>
                                <div class="code-container">
                                    <pre id="${uniqueId}">${escapeHtml(codeClean)}</pre>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    chatHistory.innerHTML += `
                        <div class="message-wrapper ai">
                            <div class="message">${formatText(content)}</div>
                        </div>
                    `;
                }
            }

            if (scroll) chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const prompt = input.value.trim();
            const sendBtn = document.getElementById('sendBtn');
            const chatHistory = document.getElementById('chatHistory');

            if (!prompt) return;

            let isNewChat = false;
            if (!currentChatId) {
                isNewChat = true;
                currentChatId = 'chat-' + Date.now();
                chats.unshift({
                    id: currentChatId,
                    title: prompt.substring(0, 28) + (prompt.length > 28 ? '...' : ''),
                    messages: []
                });
                renderChatList();
            }

            const currentChat = chats.find(c => c.id === currentChatId);
            currentChat.messages.push({ role: 'user', content: prompt });
            saveChatsToStorage();

            appendMessageToUI('user', prompt);

            input.value = '';
            input.style.height = 'auto';
            sendBtn.disabled = true;

            // طلب تسمية ذكية تلقائية في الخلفية لأول رسالة
            if (isNewChat) {
                generateAutoTitle(currentChatId, prompt);
            }

            const loadingId = 'loading-' + Date.now();
            chatHistory.innerHTML += `
                <div class="message-wrapper ai" id="${loadingId}">
                    <div class="message" style="color: var(--primary);">⏳ جاري التفكير وكتابة الرد...</div>
                </div>
            `;
            chatHistory.scrollTop = chatHistory.scrollHeight;

            // إرسال آخر 10 رسائل للحفاظ على سياق المحادثة
            const contextMessages = [
                { role: "system", content: systemInstruction },
                ...currentChat.messages.slice(-10)
            ];

            try {
                const response = await fetch(`https://api.groq.com/openai/v1/chat/completions`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: MODEL_NAME,
                        messages: contextMessages,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                const reply = data.choices[0].message.content;
                document.getElementById(loadingId).remove();

                currentChat.messages.push({ role: 'assistant', content: reply });
                saveChatsToStorage();

                appendMessageToUI('assistant', reply);

            } catch (error) {
                document.getElementById(loadingId).remove();
                chatHistory.innerHTML += `
                    <div class="message-wrapper ai">
                        <div class="message" style="color: var(--danger);">حدث خطأ: ${error.message}</div>
                    </div>
                `;
            } finally {
                sendBtn.disabled = false;
                chatHistory.scrollTop = chatHistory.scrollHeight;
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function checkEnter(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function formatText(text) {
            return escapeHtml(text)
                .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
                .replace(/\n/g, '<br>');
        }

        function copyText(elementId) {
            const text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text);
            alert("تم نسخ الكود بنجاح! ✅");
        }

        function downloadHtml(elementId) {
            const text = document.getElementById(elementId).innerText;
            const blob = new Blob([text], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'website-by-mustafa.html';
            a.click();
            URL.revokeObjectURL(url);
        }

        function openFullPreview(elementId) {
            const text = document.getElementById(elementId).innerText;
            const newWin = window.open();
            newWin.document.open();
            newWin.document.write(text);
            newWin.document.close();
        }

        // تحميل القائمة والشاشة الافتتاحية عند فتح الصفحة
        renderChatList();
        renderWelcomeScreen();
    </script>
  <script>
    // 1. حقن ملف Manifest ديناميكياً لتفعيل قابلية التثبيت
    const manifestData = {
        "name": "مساعد مصطفى عبدالرحمن الذكي",
        "short_name": "مساعد AI",
        "start_url": "./",
        "display": "standalone",
        "background_color": "#0f172a",
        "theme_color": "#38bdf8",
        "icons": [
            {
                "src": "https://cdn-icons-png.flaticon.com/512/16938/16938031.png",
                "sizes": "512x512",
                "type": "image/png"
            }
        ]
    };
    const stringManifest = JSON.stringify(manifestData);
    const blob = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    const manifestTag = document.createElement('link');
    manifestTag.rel = 'manifest';
    manifestTag.href = manifestURL;
    document.head.appendChild(manifestTag);

    // 2. تسجيل Service Worker برمجيياً لدعم التثبيت (PWA)
    if ('serviceWorker' in navigator) {
        const swCode = `
            self.addEventListener('install', (e) => {
                self.skipWaiting();
            });
            self.addEventListener('activate', (e) => {
                e.waitUntil(clients.claim());
            });
            self.addEventListener('fetch', (e) => {
                e.respondWith(
                    fetch(e.request).catch(() => caches.match(e.request))
                );
            });
        `;
        const swBlob = new Blob([swCode], {type: 'text/javascript'});
        const swURL = URL.createObjectURL(swBlob);
        
        navigator.serviceWorker.register(swURL)
            .then(() => console.log("Service Worker Registered Successfully!"))
            .catch((err) => console.log("SW Registration Failed:", err));
    }
</script>
